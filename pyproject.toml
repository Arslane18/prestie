[project]
name = "prestie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arslane18", email = "ami54500@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "voyageai>=0.5.0",
]

[project.scripts]
prestie = "prestie:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = ["integration: tests that read the local scraped cache in data/ (skipped if absent)"]
